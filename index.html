<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v2true | Portfolio</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .profile-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .discord {
            background-color: #5865F2;
            color: #ffffff;
        }
        .discord:hover {
            background-color: #4752C4;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
        }

        .tiktok {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #FE2C55;
        }
        .tiktok:hover {
            background-color: #FE2C55;
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.4);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>v2true</h1>
        <p>After Effects Editor & Roblox Creator</p>

        <div class="links-container">
            <a href="#" target="_blank" class="btn tiktok">Follow my TikTok</a>
            <a href="#" target="_blank" class="btn discord">Join the Discord Server</a>
        </div>
    </div>

</body>
</html>
