<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #070707, #1c1712, #0d0b09);
            color: #ffffff;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 24px;
            background: rgba(15, 13, 11, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9);
            animation: fadeIn 1s ease;
        }
        .avatar-icon {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(212,175,55,0.3));
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #bfae99;
            font-size: 0.95rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .roblox {
            background: #ffffff;
            color: #000000;
        }
        .roblox:hover {
            background: #d4af37;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.3);
        }
        .tiktok {
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
        }
        .tiktok:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
        .discord {
            background: #111111;
            border: 1px solid #d4af37;
            color: #d4af37;
        }
        .discord:hover {
            background: #d4af37;
            color: #000000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }
        .downloads-btn {
            background: linear-gradient(135deg, #d4af37, #997300);
            color: #000000;
            font-weight: 700;
        }
        .downloads-btn:hover {
            filter: brightness(1.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(212,175,55,0.5);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="profile-container">
