<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v2true | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #ffffff;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .profile-container {
            text-align: center;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            animation: fadeIn 1s ease;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            transition: all 0.25s ease;
        }
        /* Roblox */
        .roblox {
            background: #ffffff;
            color: #000000;
        }
        .roblox:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        /* TikTok */
        .tiktok {
            background: #000000;
            border: 2px solid #FE2C55;
            color: #ffffff;
        }
        .tiktok:hover {
            background: #FE2C55;
            transform: scale(1.05);
        }
        /* Discord */
        .discord {
            background: #5865F2;
            color: #ffffff;
        }
        .discord:hover {
            background: #4752C4;
            transform: scale(1.05);
        }
        /* Downloads Page Link */
        .downloads-btn {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .downloads-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 500px) {
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>v2true</h1>
        <p>After Effects Editor & Roblox Creator</p>
        
        <div class="links-container">
            <a href="https://www.roblox.com/users/7772527230/profile" target="_blank" class="btn roblox">My Roblox Profile</a>
            <a href="https://www.tiktok.com/@v2trueh7vn?_r=1&_t=ZT-96yF2zC6qU9" target="_blank" class="btn tiktok">Follow my TikTok</a>
            <a href="https://discord.gg/4TP3AQcXw" target="_blank" class="btn discord">Join the Discord Server</a>
            <a href="downloads.html" class="btn downloads-btn">🎬 AE Presets & Tutorials</a>
        </div>
    </div>

</body>
</html>
